name: Sauvegarde BDD vers Google Drive

on:
  schedule:
    - cron: "0 2 * * *" # tous les jours a 02:00 UTC
  workflow_dispatch: {} # bouton "Run workflow" pour un lancement manuel

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer le client PostgreSQL 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Installer rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurer rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Lancer la sauvegarde
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RCLONE_REMOTE: gdrive
          RCLONE_PATH: rucher-backups
          KEEP: "30"
        run: bash scripts/backup-db.sh
